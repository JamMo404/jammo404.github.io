<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>jammo</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
}

/* NAV */
.nav{
display:flex;
justify-content:center;
gap:40px;
padding:30px 0;
flex-wrap:wrap;
}

.nav a{
color:#aaa;
text-decoration:none;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.nav a:hover,
.nav a.active{
color:red;
}

/* 标题 */
.main-title{
text-align:center;
font-family:Futura,Arial;
font-size:64px;
margin:40px 0 20px;
}

/* 头像 */
.avatar{
display:block;
margin:0 auto 60px;
width:140px;
height:140px;
object-fit:cover;
border-radius:50%;
border:2px solid #333;
transition:.3s;
filter:grayscale(100%);
}

.avatar:hover{
border-color:red;
transform:scale(1.05);
filter:grayscale(0%);
}

/* 页面 */
.page{
display:none;
padding:0 10% 100px;
}

.page.active{
display:block;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:30px;
}

/* 卡片 */
.card{
position:relative;
height:200px;
background:#111;
border:1px solid #333;
overflow:hidden;
cursor:pointer;
}

/* 视频 */
.card video{
width:100%;
height:100%;
object-fit:cover;
transition:.3s;
}

/* 文本 */
.card span{
position:absolute;
color:#aaa;
left:50%;
top:50%;
transform:translate(-50%,-50%);
transition:.3s;
}

.card:hover span{
opacity:0;
}

.card:hover{
border-color:red;
}

/* 全屏 */
.overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
z-index:999;
}

.overlay video{
width:100%;
height:100%;
object-fit:contain;
}

.overlay-info{
position:absolute;
bottom:40px;
left:40px;
max-width:500px;
}

.close{
position:absolute;
top:30px;
right:40px;
cursor:pointer;
color:#aaa;
}
.close:hover{color:red;}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
<a onclick="showPage('about', this)" class="active">About</a>
<a onclick="showPage('featured', this)">FeaturedProject</a>
<a onclick="showPage('video', this)">Video</a>
</div>

<h1 class="main-title">JAM MO</h1>

<img src="images/avatar.jpg" class="avatar">

<!-- ABOUT -->
<div id="about" class="page active">
<p style="max-width:700px;margin:auto;color:#ccc;line-height:1.8;">
Multidisciplinary Artist working across CGI, realtime visuals, sound and interactive installation.
</p>
</div>

<!-- FEATURED -->
<div id="featured" class="page">
<h2>FeaturedProject</h2>

<div class="grid">

<!-- card 1 -->
<div class="card"
onclick="openProject('video1.mp4','Project 01','Featured Work','AV + Code')"
onmouseenter="let v=this.querySelector('video'); v.play()"
onmouseleave="let v=this.querySelector('video'); v.pause(); v.currentTime=0;">

<video src="video1.mp4" poster="images/cover1.jpg" muted loop playsinline></video>
<span>Project 01</span>

</div>

</div>
</div>

<!-- VIDEO -->
<div id="video" class="page">
<h2>Video</h2>

<div class="grid">

<!-- video1 -->
<div class="card"
onclick="openProject('video1.mp4','Video 01','Realtime Visual','Sound Design')"
onmouseenter="let v=this.querySelector('video'); v.play()"
onmouseleave="let v=this.querySelector('video'); v.pause(); v.currentTime=0;">

<video src="video1.mp4" poster="images/cover1.jpg" muted loop playsinline></video>
<span>Video 01</span>

</div>

<!-- ✅ video2（你缺的就是这个） -->
<div class="card"
onclick="openProject('video2.mp4','Video 02','Experiment','Audio + Visual')"
onmouseenter="let v=this.querySelector('video'); v.play()"
onmouseleave="let v=this.querySelector('video'); v.pause(); v.currentTime=0;">

<video src="video2.mp4" poster="images/cover2.jpg" muted loop playsinline></video>
<span>Video 02</span>

</div>

</div>
</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay">

<div class="close" onclick="closeProject()">CLOSE</div>

<video id="overlayVideo" controls autoplay></video>

<div class="overlay-info">
<h2 id="title"></h2>
<p id="desc"></p>
<p id="credits"></p>
</div>

</div>

<script>
function showPage(id, el){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
document.getElementById(id).classList.add('active')

document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'))
el.classList.add('active')
}

function openProject(video,title,desc,credits){
document.getElementById('overlay').style.display='block'

let v = document.getElementById('overlayVideo')
v.src = video
v.play()

document.getElementById('title').innerText = title
document.getElementById('desc').innerText = desc
document.getElementById('credits').innerText = credits
}

function closeProject(){
document.getElementById('overlay').style.display='none'
document.getElementById('overlayVideo').pause()
}
</script>

</body>
</html>
