<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>jammo</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial, Helvetica, sans-serif;
}

/* NAV */
.nav{
display:flex;
justify-content:center;
gap:30px;
padding:25px 10px;
flex-wrap:wrap;
}

.nav a{
color:#888;
text-decoration:none;
font-weight:bold;
cursor:pointer;
}

.nav a.active,
.nav a:hover{
color:red;
}

/* TITLE */
.main-title{
text-align:center;
font-size:72px;
font-weight:900;
letter-spacing:6px;
margin:40px 0 10px;
}

/* BRAND */
.brand{
display:block;
margin:0 auto 40px;
width:320px;
height:180px;
object-fit:cover;
}

/* PAGE */
.page{
display:none;
padding:0 8% 100px;
}
.page.active{display:block;}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:30px;
}

/* CARD */
.card{
position:relative;
height:200px;
background:#111;
border:1px solid #333;
cursor:pointer;
overflow:hidden;
}

.card video,
.card img{
width:100%;
height:100%;
object-fit:cover;
}

.card span{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
color:#aaa;
}

.card:hover span{opacity:0;}
.card:hover{border-color:red;}

/* overlay */
.overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
z-index:999;
}

.overlay video,
.overlay img{
width:100%;
height:100%;
object-fit:contain;
}

.close{
position:absolute;
top:30px;
right:40px;
cursor:pointer;
color:#aaa;
}
.close:hover{color:red;}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
<a onclick="showPage('about',this)" class="active">About</a>
<a onclick="showPage('featured',this)">Featured</a>
<a onclick="showPage('video',this)">Video</a>
<a onclick="showPage('cgi',this)">CGI</a>
<a onclick="showPage('installation',this)">Installation</a>
<a onclick="showPage('sound',this)">Sound</a>
<a onclick="showPage('lab',this)">Lab</a>
<a onclick="showPage('visual',this)">Visual</a>
</div>

<h1 class="main-title">JAM MO</h1>

<video class="brand" src="brand.mp4" autoplay muted loop playsinline></video>

<!-- ABOUT -->
<div id="about" class="page active">
<p style="max-width:800px;margin:auto;line-height:1.8;color:#ccc;">
Jam Mo is a multidisciplinary artist working across CGI, real-time visuals, sound art, and interactive systems.
His work explores computational perception and perceptual space through nonlinear audiovisual structures.
</p>
</div>

<!-- 各类目 -->
<div id="featured" class="page"><div class="grid" id="featuredGrid"></div></div>
<div id="video" class="page"><div class="grid" id="videoGrid"></div></div>
<div id="cgi" class="page"><div class="grid" id="cgiGrid"></div></div>
<div id="installation" class="page"><div class="grid" id="installationGrid"></div></div>
<div id="sound" class="page"><div class="grid" id="soundGrid"></div></div>
<div id="lab" class="page"><div class="grid" id="labGrid"></div></div>
<div id="visual" class="page"><div class="grid" id="visualGrid"></div></div>

<!-- overlay -->
<div id="overlay" class="overlay">
<div class="close" onclick="closeProject()">CLOSE</div>
<video id="overlayVideo" controls></video>
<img id="overlayImg">
</div>

<script>

/* 切换页面 */
function showPage(id,el){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
document.getElementById(id).classList.add('active')

document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'))
el.classList.add('active')
}

/* 打开视频 */
function openVideo(src){
let v=document.getElementById('overlayVideo')
let img=document.getElementById('overlayImg')

img.style.display="none"
v.style.display="block"

v.src=src
document.getElementById('overlay').style.display='block'
}

/* 打开图片 */
function openImage(src){
let v=document.getElementById('overlayVideo')
let img=document.getElementById('overlayImg')

v.pause()
v.style.display="none"

img.src=src
img.style.display="block"

document.getElementById('overlay').style.display='block'
}

/* 关闭 */
function closeProject(){
document.getElementById('overlay').style.display='none'
document.getElementById('overlayVideo').pause()
}

/* 分类规则（关键） */
function getCategory(name){
name = name.toLowerCase()

if(name.startsWith("featured")) return "featured"
if(name.startsWith("video")) return "video"
if(name.startsWith("cgi")) return "cgi"
if(name.startsWith("installation")) return "installation"
if(name.startsWith("sound")) return "sound"
if(name.startsWith("lab")) return "lab"

return null
}

/* 加载视频 */
async function loadVideos(){
let res = await fetch("https://api.github.com/repos/JamMo404/jammo404.github.io/contents/videoall")
let files = await res.json()

files.forEach(f=>{
if(!f.name.endsWith(".mp4")) return

let cat = getCategory(f.name)
if(!cat) return

let grid = document.getElementById(cat+"Grid")
if(!grid) return

let card = document.createElement("div")
card.className="card"
card.onclick=()=>openVideo("videoall/"+f.name)

card.innerHTML=`
<video src="videoall/${f.name}" muted loop playsinline></video>
<span>${f.name}</span>
`

card.onmouseenter=()=>card.querySelector("video").play()
card.onmouseleave=()=>{
let v=card.querySelector("video")
v.pause()
v.currentTime=0
}

grid.appendChild(card)
})
}

/* 加载图片 */
async function loadImages(){
let res = await fetch("https://api.github.com/repos/JamMo404/jammo404.github.io/contents/images")
let files = await res.json()

files.forEach(f=>{
if(!f.name.match(/\.(jpg|png|webp)$/)) return

let grid = document.getElementById("visualGrid")

let card=document.createElement("div")
card.className="card"
card.onclick=()=>openImage("images/"+f.name)

card.innerHTML=`
<img src="images/${f.name}">
<span>${f.name}</span>
`

grid.appendChild(card)
})
}

loadVideos()
loadImages()

</script>

</body>
</html>
