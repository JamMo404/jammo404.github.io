<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>jammo</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial, Helvetica, sans-serif;
}

/* NAV */
.nav{
display:flex;
justify-content:center;
gap:40px;
padding:30px 0;
flex-wrap:wrap;
}

.nav a{
color:#aaa;
text-decoration:none;
font-weight:bold;
cursor:pointer;
}

.nav a.active,
.nav a:hover{color:red;}

/* 标题 */
.main-title{
text-align:center;
font-size:64px;
font-weight:900;
letter-spacing:4px;
margin:40px 0 10px;
}

/* brand */
.brand{
display:block;
margin:0 auto 40px;
width:320px;
height:180px;
object-fit:cover;
}

/* page */
.page{
display:none;
padding:0 10% 100px;
}
.page.active{display:block;}

/* grid */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:30px;
}

/* card */
.card{cursor:pointer;}

.card video,
.card img{
width:100%;
height:200px;
object-fit:cover;
background:#111;
}

/* info */
.info{margin-top:8px;}
.info h4{margin:0;font-size:14px;}
.info p{margin:0;font-size:12px;color:#777;}

/* overlay */
.overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
z-index:999;
}

.overlay video,
.overlay img{
width:100%;
height:100%;
object-fit:contain;
}

.close{
position:absolute;
top:30px;
right:40px;
cursor:pointer;
color:#aaa;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
<a onclick="showPage('featured',this)" class="active">FeaturedProject</a>
<a onclick="showPage('video',this)">Video</a>
<a onclick="showPage('cgi',this)">CGI</a>
<a onclick="showPage('installation',this)">Installation</a>
<a onclick="showPage('sound',this)">Sound</a>
<a onclick="showPage('lab',this)">Lab</a>
<a onclick="showPage('visual',this)">Visual</a>
</div>

<h1 class="main-title">JAM MO</h1>
<video class="brand" src="brand.mp4" autoplay muted loop playsinline></video>

<!-- pages -->
<div id="featured" class="page active"><div class="grid" id="featuredGrid"></div></div>
<div id="video" class="page"><div class="grid" id="videoGrid"></div></div>
<div id="cgi" class="page"><div class="grid" id="cgiGrid"></div></div>
<div id="installation" class="page"><div class="grid" id="installationGrid"></div></div>
<div id="sound" class="page"><div class="grid" id="soundGrid"></div></div>
<div id="lab" class="page"><div class="grid" id="labGrid"></div></div>
<div id="visual" class="page"><div class="grid" id="visualGrid"></div></div>

<!-- overlay -->
<div id="overlay" class="overlay">
<div class="close" onclick="closeOverlay()">CLOSE</div>
<video id="overlayVideo" controls autoplay></video>
<img id="overlayImage">
</div>

<script>

/* ===== 🎯 所有作品只在这里管理 ===== */
const WORKS = [

/* VIDEO */
{
type:"video",
src:"video/video001.mp4",
title:"VIDEO001",
desc:"Realtime AV performance",
categories:["featured","video","installation"]
},
{
type:"video",
src:"video/video002.mp4",
title:"VIDEO002",
desc:"Generative system",
categories:["video","cgi","lab"]
},
{
type:"video",
src:"video/video003.mp4",
title:"VIDEO003",
desc:"Sound reactive visual",
categories:["video","sound"]
},

/* VISUAL */
{
type:"image",
src:"images/visual001.jpg",
title:"VISUAL001",
desc:"Still frame study",
categories:["visual"]
},
{
type:"image",
src:"images/visual002.jpg",
title:"VISUAL002",
desc:"Procedural image",
categories:["visual"]
}

]

/* ===== 渲染 ===== */
function render(){

WORKS.forEach(w=>{
w.categories.forEach(cat=>{
let grid = document.getElementById(cat+"Grid")
if(!grid) return

let card = document.createElement("div")
card.className="card"

if(w.type==="video"){
card.innerHTML=`
<video src="${w.src}" muted loop></video>
<div class="info">
<h4>${w.title}</h4>
<p>${w.desc}</p>
</div>
`

card.onmouseenter=()=>card.querySelector("video").play()
card.onmouseleave=()=>{
let v=card.querySelector("video")
v.pause();v.currentTime=0
}
card.onclick=()=>openVideo(w.src)
}

if(w.type==="image"){
card.innerHTML=`
<img src="${w.src}">
<div class="info">
<h4>${w.title}</h4>
<p>${w.desc}</p>
</div>
`
card.onclick=()=>openImage(w.src)
}

grid.appendChild(card)
})
})

}

/* overlay */
function openVideo(src){
let v=document.getElementById("overlayVideo")
let i=document.getElementById("overlayImage")

i.style.display="none"
v.style.display="block"
v.src=src
v.play()

overlay.style.display="block"
}

function openImage(src){
let v=document.getElementById("overlayVideo")
let i=document.getElementById("overlayImage")

v.pause()
v.style.display="none"
i.style.display="block"
i.src=src

overlay.style.display="block"
}

function closeOverlay(){
overlay.style.display="none"
document.getElementById("overlayVideo").pause()
}

/* 页面切换 */
function showPage(id,el){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
document.getElementById(id).classList.add('active')

document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'))
el.classList.add('active')
}

/* init */
render()

</script>

</body>
</html>
