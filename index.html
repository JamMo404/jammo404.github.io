<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>jammo</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
}

/* NAV */
.nav{
display:flex;
justify-content:center;
gap:30px;
padding:30px 0;
flex-wrap:wrap;
}
.nav a{
color:#888;
text-decoration:none;
cursor:pointer;
}
.nav a.active{color:red}

/* 标题 */
.main-title{
text-align:center;
font-size:72px;
font-weight:900;
letter-spacing:4px;
}

/* brand */
.brand{
display:block;
margin:20px auto;
width:320px;
height:180px;
object-fit:cover;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:30px;
padding:40px;
}

/* 卡片 */
.card{
position:relative;
height:200px;
background:#111;
cursor:pointer;
overflow:hidden;
}

.card video,
.card img{
width:100%;
height:100%;
object-fit:cover;
}

.card span{
position:absolute;
bottom:10px;
left:10px;
font-size:12px;
color:#aaa;
}

/* overlay */
.overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
z-index:999;
}

.overlay video,
.overlay img{
width:100%;
height:100%;
object-fit:contain;
}

.close{
position:absolute;
top:30px;
right:40px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="nav">
<a onclick="loadVideos()" class="active">Video</a>
<a onclick="loadImages()">Visual</a>
</div>

<h1 class="main-title">JAM MO</h1>

<video class="brand" src="brand.mp4" autoplay muted loop></video>

<div id="grid" class="grid"></div>

<div id="overlay" class="overlay" onclick="closeOverlay()">
<div class="close">CLOSE</div>
<div id="viewer"></div>
</div>

<script>
const USER = "JamMo404"
const REPO = "jammo404.github.io"

/* ===== 读取 GitHub 文件 ===== */
async function fetchFiles(folder){
let url = `https://api.github.com/repos/${USER}/${REPO}/contents/${folder}`
let res = await fetch(url)
return await res.json()
}

/* ===== 加载视频 ===== */
async function loadVideos(){
setActive(0)
let files = await fetchFiles("video")

let grid = document.getElementById("grid")
grid.innerHTML = ""

files
.filter(f=>f.name.endsWith(".mp4") || f.name.endsWith(".webm"))
.sort((a,b)=>a.name.localeCompare(b.name))
.forEach((file,i)=>{

let title = `video${String(i+1).padStart(3,"0")}`

let div = document.createElement("div")
div.className="card"

div.innerHTML = `
<video src="${file.download_url}" muted loop></video>
<span>${title}</span>
`

div.onmouseenter = ()=>div.querySelector("video").play()
div.onmouseleave = ()=>{
let v=div.querySelector("video")
v.pause()
v.currentTime=0
}

div.onclick = ()=>openVideo(file.download_url)

grid.appendChild(div)
})
}

/* ===== 加载图片 ===== */
async function loadImages(){
setActive(1)
let files = await fetchFiles("images")

let grid = document.getElementById("grid")
grid.innerHTML = ""

files
.filter(f=>f.name.match(/\.(jpg|png|webp)/))
.sort((a,b)=>a.name.localeCompare(b.name))
.forEach((file,i)=>{

let title = `visual${String(i+1).padStart(3,"0")}`

let div = document.createElement("div")
div.className="card"

div.innerHTML = `
<img src="${file.download_url}">
<span>${title}</span>
`

div.onclick = ()=>openImage(file.download_url)

grid.appendChild(div)
})
}

/* ===== overlay ===== */
function openVideo(src){
let o=document.getElementById("overlay")
let v=document.getElementById("viewer")

v.innerHTML = `<video src="${src}" controls autoplay></video>`
o.style.display="block"
}

function openImage(src){
let o=document.getElementById("overlay")
let v=document.getElementById("viewer")

v.innerHTML = `<img src="${src}">`
o.style.display="block"
}

function closeOverlay(){
document.getElementById("overlay").style.display="none"
document.getElementById("viewer").innerHTML=""
}

/* nav 状态 */
function setActive(i){
document.querySelectorAll(".nav a").forEach(a=>a.classList.remove("active"))
document.querySelectorAll(".nav a")[i].classList.add("active")
}

/* 默认加载 */
loadVideos()
</script>

</body>
</html>
