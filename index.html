<script>

const repo = "JamMo404/jammo404.github.io"

/* 分类容器 */
const grids = {
featured: document.getElementById("featuredGrid"),
video: document.getElementById("videoGrid"),
cgi: document.getElementById("cgiGrid"),
installation: document.getElementById("installationGrid"),
sound: document.getElementById("soundGrid"),
lab: document.getElementById("labGrid")
}

/* 分类计数器 */
const counters = {
featured: 1,
video: 1,
cgi: 1,
installation: 1,
sound: 1,
lab: 1
}

/* 读取所有视频 */
async function loadAllVideos(){

let res = await fetch(`https://api.github.com/repos/${repo}/contents/videoall`)
let files = await res.json()

files.forEach(f=>{

if(!f.name.endsWith(".mp4")) return

let name = f.name.toLowerCase()

let type = null

if(name.startsWith("featured")) type="featured"
else if(name.startsWith("video")) type="video"
else if(name.startsWith("cgi")) type="cgi"
else if(name.startsWith("installation")) type="installation"
else if(name.startsWith("sound")) type="sound"
else if(name.startsWith("lab")) type="lab"

if(!type) return

let id = String(counters[type]).padStart(3,'0')
counters[type]++

let card = `
<div class="card"
onmouseenter="this.querySelector('video').play()"
onmouseleave="let v=this.querySelector('video');v.pause();v.currentTime=0;"
onclick="openVideo('${f.download_url}')">
<video src="${f.download_url}" muted loop></video>
<span>${type}${id}</span>
</div>
`

grids[type].innerHTML += card

})

}

loadAllVideos()

</script>
